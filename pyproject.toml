[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retention-bench"
version = "0.1.0"
description = "Day-one return prediction on two public game datasets: label, temporal split, baselines, calibration, results."
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Pengjun Lu"}]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "temporal-leak @ git+https://github.com/PenguinPowerUp/csds395-temporal-leak@v0.1.0",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plot = ["matplotlib>=3.8"]

[project.scripts]
retention-bench = "retention_bench.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
